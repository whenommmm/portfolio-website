<!doctype html>

    <title>Vansh Srivastava | Game Designer Portfolio</title>
    <meta name="description" content="Portfolio of Vansh Srivastava — CS student and aspiring game designer creating mechanics, puzzles and playable worlds." />
    <!-- Day/night theme before first paint: the visitor's own choice once they've
         used the switch; until then it follows their clock, day from 6am to 6pm
         (see src/theme.js) -->
    <script>
      (function () {
        var hour = new Date().getHours();
        var theme = hour >= 6 && hour < 18 ? 'day' : 'night';
        try {
          var chosen = localStorage.getItem('theme');
          if (chosen === 'day' || chosen === 'night') theme = chosen;
        } catch (e) { /* storage blocked: the clock decides */ }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Google Fonts — all fonts used across the portfolio -->
